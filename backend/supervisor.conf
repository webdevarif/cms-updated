; Supervisor configuration for Digital Farmers CMS
; Production process management for gunicorn and background tasks

[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[supervisord]
logfile=/var/log/supervisor/supervisord.log
logfile_maxbytes=50MB
logfile_backups=10
loglevel=info
pidfile=/var/run/supervisord.pid
nodaemon=false
minfds=1024
minprocs=200

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

; Program: Gunicorn WSGI Server
[program:cms_gunicorn]
command=/var/www/cms/venv/bin/gunicorn --config gunicorn.conf.py core.wsgi:application
directory=/var/www/cms/backend
user=www-data
group=www-data
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/var/log/gunicorn/cms_gunicorn.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=10
environment=DJANGO_SETTINGS_MODULE=core.settings.production,PYTHONPATH=/var/www/cms/backend

; Program: Django Background Tasks Process
[program:cms_background_tasks]
command=/var/www/cms/venv/bin/python manage.py process_tasks
directory=/var/www/cms/backend
user=www-data
group=www-data
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/var/log/gunicorn/cms_background_tasks.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=10
environment=DJANGO_SETTINGS_MODULE=core.settings.production,PYTHONPATH=/var/www/cms/backend

; Program: Django Background Tasks Worker (alternative)
[program:cms_tasks_worker]
command=/var/www/cms/venv/bin/python manage.py run_tasks
directory=/var/www/cms/backend
user=www-data
group=www-data
autostart=false
autorestart=true
redirect_stderr=true
stdout_logfile=/var/log/gunicorn/cms_tasks_worker.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=10
environment=DJANGO_SETTINGS_MODULE=core.settings.production,PYTHONPATH=/var/www/cms/backend

; Group: Web Services
[group:cms_web]
programs=cms_gunicorn
priority=100

; Group: Background Services
[group:cms_background]
programs=cms_background_tasks,cms_tasks_worker
priority=200

; Event listeners
[eventlistener:cms_events]
command=/var/www/cms/venv/bin/python /var/www/cms/backend/scripts/supervisor_events.py
events=PROCESS_STATE,PROCESS_COMMUNICATION_STDOUT,PROCESS_COMMUNICATION_STDERR
